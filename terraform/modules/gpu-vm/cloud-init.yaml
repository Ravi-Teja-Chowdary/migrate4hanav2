#cloud-config
package_update: true

packages:
  - python3.11
  - python3.11-venv
  - python3-pip
  - build-essential

runcmd:
  # Install NVIDIA drivers if not pre-installed
  - |
    if ! command -v nvidia-smi &> /dev/null; then
      apt-get install -y linux-headers-$(uname -r)
      distribution=$(. /etc/os-release; echo $ID$VERSION_ID | sed -e 's/\.//g')
      curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      apt-get update
      apt-get install -y nvidia-driver-535 nvidia-utils-535
    fi

  # Install Python 3.11 and pip
  - update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
  - python3 -m pip install --upgrade pip

  # Install vLLM
  - python3 -m pip install vllm

  # Download model from Azure Blob Storage
  - mkdir -p /opt/models
  - az storage blob download-batch -d /opt/models -s llm-models --account-name ${storage_account_name} --auth-mode login

  # Create systemd service for vLLM
  - |
    cat > /etc/systemd/system/vllm.service << 'EOF'
    [Unit]
    Description=vLLM OpenAI-compatible API Server
    After=network.target

    [Service]
    Type=simple
    User=root
    WorkingDirectory=/opt/models
    ExecStart=/usr/local/bin/python3 -m vllm.entrypoints.openai.api_server --model /opt/models/llama-3-8b --host 0.0.0.0 --port 8000
    Restart=always
    RestartSec=10
    Environment=CUDA_VISIBLE_DEVICES=0

    [Install]
    WantedBy=multi-user.target
    EOF

  # Enable and start vLLM service
  - systemctl daemon-reload
  - systemctl enable vllm.service
  - systemctl start vllm.service
